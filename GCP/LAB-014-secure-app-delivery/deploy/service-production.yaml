apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: quote-api-production
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/cpu-throttling: "true"
    spec:
      serviceAccountName: lab014-runtime@invalid-project.iam.gserviceaccount.com # from-param: ${runtime-service-account}
      containerConcurrency: 40
      timeoutSeconds: 30
      containers:
        - image: shipping-quote-api
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: QUOTE_PRICE_FACTOR
              value: "1.00"
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
