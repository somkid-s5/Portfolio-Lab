<title id="title">Lab 14 secure application delivery architecture</title>
<desc id="desc">GitHub pull requests test without cloud credentials. The trusted main branch uses Workload Identity Federation to invoke Cloud Build, which builds and tests an immutable image in Artifact Registry. Cloud KMS signs an attestation checked by a project-level Binary Authorization policy. Cloud Deploy sends the same digest to Cloud Run staging, then requires a separate production approval and verified canary progression.</desc>
