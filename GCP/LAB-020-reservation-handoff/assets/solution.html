<title id="lab20-title">Lab 20 — Reservation and report handoff platform</title>
<desc id="lab20-desc">Staff reaches a Cloud Run API through IAP. The API writes bookings to private Cloud SQL and publishes report requests to Pub/Sub. Pub/Sub sends authenticated pushes to a separate Cloud Run worker, which reads Cloud SQL and writes private versioned reports to Cloud Storage. The API proxies report downloads after checking ownership; users have no direct bucket access. The Direct VPC egress subnet reaches Cloud SQL through Private Services Access. Cloud Build publishes one image digest to Artifact Registry for Stage then Production. Cloud Logging and Monitoring support operations.</desc>
