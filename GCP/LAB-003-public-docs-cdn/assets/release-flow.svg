<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc"><title id="title">Release ordering and verified rollback</title><desc id="desc">Upload immutable assets, archive the release index, publish the root index using a generation precondition, then invalidate only index and verify. Rollback verifies remote assets and archived index before changing the root generation. Browser cache is separate.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#2563eb"/></marker></defs><rect width="1280" height="480" fill="white"/><g font-family="Arial,sans-serif" fill="#1f2937"><text x="36" y="44" font-size="28" font-weight="700">Publish in order. Roll back with evidence.</text><rect x="30" y="90" width="260" height="115" rx="4" fill="#eff6ff" stroke="#bfdbfe"/><text x="160" y="128" text-anchor="middle" font-size="21" fill="#1f2937">1 / Immutable CSS</text><text x="160" y="159" text-anchor="middle" font-size="16" fill="#1f2937">content hash · generation=0</text><text x="160" y="185" text-anchor="middle" font-size="16" fill="#1f2937">TTL 31536000 / immutable</text><rect x="350" y="90" width="260" height="115" rx="4" fill="#eff6ff" stroke="#bfdbfe"/><text x="480" y="128" text-anchor="middle" font-size="21" fill="#1f2937">2 / Archived index</text><text x="480" y="159" text-anchor="middle" font-size="17" fill="#1f2937">releases/v2/index.html</text><text x="480" y="185" text-anchor="middle" font-size="16" fill="#1f2937">generation=0</text><rect x="670" y="90" width="260" height="115" rx="4" fill="#f0fdf4" stroke="#bbf7d0"/><text x="800" y="128" text-anchor="middle" font-size="21" fill="#1f2937">3 / Publish index</text><text x="800" y="159" text-anchor="middle" font-size="17" fill="#1f2937">root /index.html</text><text x="800" y="185" text-anchor="middle" font-size="16" fill="#1f2937">expected generation = G</text><rect x="990" y="90" width="260" height="115" rx="4" fill="#fff7ed" stroke="#fed7aa"/><text x="1120" y="128" text-anchor="middle" font-size="21" fill="#1f2937">4 / Verify delivery</text><text x="1120" y="159" text-anchor="middle" font-size="16" fill="#1f2937">targeted index invalidation</text><text x="1120" y="185" text-anchor="middle" font-size="16" fill="#1f2937">TLS / bytes / cache logs</text><g stroke="#2563eb" stroke-width="2" marker-end="url(#a)"><path d="M290 147H350"/><path d="M610 147H670"/><path d="M930 147H990"/></g><rect x="30" y="270" width="370" height="110" rx="4" fill="#f5f3ff" stroke="#d8b4fe"/><text x="215" y="310" text-anchor="middle" font-size="21" fill="#7c3aed">Rollback / known-good release</text><text x="215" y="344" text-anchor="middle" font-size="17" fill="#1f2937">Remote CSS + archive SHA256 match</text><rect x="480" y="270" width="370" height="110" rx="4" fill="#f5f3ff" stroke="#d8b4fe"/><text x="665" y="310" text-anchor="middle" font-size="21" fill="#7c3aed">--index-only</text><text x="665" y="344" text-anchor="middle" font-size="17" fill="#1f2937">Publish with current generation fence</text><rect x="930" y="270" width="320" height="110" rx="4" fill="#fff7ed" stroke="#fed7aa"/><text x="1090" y="310" text-anchor="middle" font-size="21" fill="#1f2937">Invalidate + retest</text><text x="1090" y="344" text-anchor="middle" font-size="16" fill="#1f2937">Does not erase browser cache</text><g stroke="#2563eb" stroke-width="2" marker-end="url(#a)"><path d="M400 325H480"/><path d="M850 325H930"/></g><text x="640" y="440" text-anchor="middle" font-size="17" fill="#1f2937">HTTP 200 and matching bytes are not sufficient: the controlled bad release fails the business-content check.</text></g></svg>