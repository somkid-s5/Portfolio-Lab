<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc"><title id="title">Public docs delivery with HTTPS and Cloud CDN</title><desc id="desc">Owned public DNS points to a global external Application Load Balancer using a Compute-managed certificate. Cloud CDN is enabled on the backend bucket; a cache miss fills from a public-read Cloud Storage bucket in Singapore. There are no VPCs or VMs in this solution.</desc><defs><marker id="req" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#2563eb"/></marker><marker id="miss" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#0f766e"/></marker></defs><rect width="1280" height="760" fill="white"/><g font-family="Arial,sans-serif" fill="#1f2937"><text x="36" y="38" font-size="16" fill="#526174">GCP SOLUTION LAB / 03 · PLANNED ARCHITECTURE</text><text x="36" y="82" font-size="32" font-weight="700">Public docs. HTTPS edge. Versioned releases.</text><rect x="250" y="120" width="1000" height="560" rx="4" fill="white" stroke="#334155"/><text x="274" y="154" font-size="22">Google Cloud / Lab project</text><rect x="20" y="175" width="200" height="126" rx="4" fill="#f8fafc" stroke="#cbd5e1"/><text x="120" y="208" text-anchor="middle" font-size="21" fill="#1f2937">Public DNS</text><text x="120" y="238" text-anchor="middle" font-size="18" fill="#0f766e">HOST → LB_IP</text><text x="120" y="270" text-anchor="middle" font-size="16" fill="#1f2937">Owned DNS provider</text><rect x="290" y="180" width="430" height="105" rx="4" fill="#f5f3ff" stroke="#d8b4fe"/><text x="505" y="210" text-anchor="middle" font-size="20" fill="#7c3aed">Compute-managed SSL certificate</text><text x="505" y="239" text-anchor="middle" font-size="17" fill="#1f2937">lab003-cert · HOST · ACTIVE required</text><text x="505" y="266" text-anchor="middle" font-size="16" fill="#1f2937">Attached to lab003-https-proxy · TLS ≥ 1.2</text><rect x="280" y="320" width="600" height="300" rx="4" fill="#fff7ed" stroke="#fed7aa"/><text x="580" y="352" text-anchor="middle" font-size="19" fill="#c2410c">Global external Application LB / EXTERNAL_MANAGED</text><svg x="364" y="394" width="72" height="72" viewBox="0 0 24 24"><title>Icon_24px_LoadBalancing_Color</title><g data-name="Product Icons"><g data-name="colored-32/load-balancing"><rect fill="none" width="24" height="24"/><g ><rect fill="#669df6" x="18" y="12" width="2" height="4"/><rect fill="#669df6" x="11" y="12" width="2" height="4"/><rect fill="#669df6" x="4" y="12" width="2" height="4"/><polygon fill="#4285f4" points="13 11 11 11 11 7 13 7 13 11"/><rect fill="#669df6" x="4" y="11" width="16" height="2"/><rect fill="#aecbfa" x="6" y="2" width="12" height="5"/><rect fill="#669df6" x="12" y="2" width="6" height="5"/><rect fill="#aecbfa" x="16" y="16" width="6" height="6"/><rect fill="#aecbfa" x="2" y="16" width="6" height="6"/><rect fill="#669df6" x="5" y="16" width="3" height="6"/><rect fill="#aecbfa" x="9" y="16" width="6" height="6"/><rect fill="#669df6" x="12" y="16" width="3" height="6"/><rect fill="#669df6" x="19" y="16" width="3" height="6"/></g></g></g></svg><text x="400" y="503" text-anchor="middle" font-size="21" fill="#c2410c">Application LB</text><text x="400" y="534" text-anchor="middle" font-size="18" fill="#1f2937">HTTPS :443</text><text x="400" y="565" text-anchor="middle" font-size="16" fill="#1f2937">HTTP :80 → HTTPS</text><svg x="704" y="394" width="72" height="72" viewBox="0 0 24 24"><title>Icon_24px_CDN_Color</title><g data-name="Product Icons"><rect fill="none" x="2" y="2" width="20" height="20"/><g ><polygon fill="#669df6" points="12 2 12 4.41 15.13 7.63 15.13 5.21 12 2"/><polygon fill="#669df6" points="19.5 12 16.38 15.13 18.88 15.13 22 12 19.5 12"/><polygon fill="#669df6" points="4.5 12 7.63 15.13 5.13 15.13 2 12 4.5 12"/><polygon fill="#669df6" points="12 22 12 19.59 15.13 16.38 15.13 18.79 12 22"/><polygon fill="#aecbfa" points="12 2 8.88 5.21 8.88 7.63 12 4.41 12 2"/><polygon fill="#aecbfa" points="18.88 8.88 16.38 8.88 19.5 12 22 12 18.88 8.88"/><polygon fill="#aecbfa" points="5.13 8.88 7.63 8.88 4.5 12 2 12 5.13 8.88"/><polygon fill="#aecbfa" points="12 22 8.88 18.79 8.88 16.38 12 19.59 12 22"/><polygon fill="#aecbfa" points="15.13 15.13 8.88 15.13 8.88 8.88 15.13 8.88 15.13 15.13"/><polygon fill="#669df6" points="15.13 8.88 15.13 15.13 8.88 15.13 15.13 8.88"/><polygon fill="#4285f4" points="15.13 8.88 15.13 15.13 12 12 15.13 8.88"/></g></g></svg><text x="740" y="503" text-anchor="middle" font-size="21" fill="#c2410c">Cloud CDN</text><text x="740" y="534" text-anchor="middle" font-size="17" fill="#1f2937">Backend bucket enabled</text><text x="740" y="565" text-anchor="middle" font-size="16" fill="#1f2937">USE_ORIGIN_HEADERS</text><rect x="930" y="320" width="290" height="300" rx="4" fill="#eff6ff" stroke="#bfdbfe"/><text x="1075" y="352" text-anchor="middle" font-size="19" fill="#1d4ed8">Origin / asia-southeast1</text><svg x="1039" y="394" width="72" height="72" viewBox="0 0 24 24"><title>Icon_24px_CloudStorage_Color</title><g data-name="Product Icons"><rect fill="#aecbfa" x="2" y="4" width="20" height="7"/><rect fill="#669df6" x="20" y="4" width="2" height="7"/><polygon fill="#4285f4" points="22 4 20 4 20 11 22 4"/><rect fill="#669df6" x="2" y="4" width="2" height="7"/><rect fill="#fff" x="6" y="7" width="6" height="1"/><rect fill="#fff" x="15" y="6" width="3" height="3" rx="1.5"/><rect fill="#aecbfa" x="2" y="13" width="20" height="7"/><rect fill="#669df6" x="20" y="13" width="2" height="7"/><polygon fill="#4285f4" points="22 13 20 13 20 20 22 13"/><rect fill="#669df6" x="2" y="13" width="2" height="7"/><rect fill="#fff" x="6" y="16" width="6" height="1"/><rect fill="#fff" x="15" y="15" width="3" height="3" rx="1.5"/></g></svg><text x="1075" y="503" text-anchor="middle" font-size="21" fill="#1d4ed8">Cloud Storage</text><text x="1075" y="534" text-anchor="middle" font-size="17" fill="#1f2937">Public-read demo bucket</text><text x="1075" y="565" text-anchor="middle" font-size="17" fill="#1f2937">index + releases/*</text><g fill="none" stroke="#334155" stroke-width="2"><rect x="84" y="408" width="72" height="44"/><path d="M108 452V465H132V452M98 465H142"/></g><text x="120" y="503" text-anchor="middle" font-size="19" fill="#1f2937">Readers / Probe</text><path d="M156 430H364" stroke="#2563eb" stroke-width="2" marker-end="url(#req)"/><text x="202" y="414" font-size="16" fill="#2563eb">HTTPS</text><path d="M436 430H704" stroke="#2563eb" stroke-width="2" marker-end="url(#req)"/><text x="524" y="414" font-size="16" fill="#2563eb">URL map / content</text><path d="M776 430H1039" stroke="#0f766e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#miss)"/><text x="897" y="414" text-anchor="middle" font-size="16" fill="#0f766e">cache miss / fill</text><text x="750" y="653" text-anchor="middle" font-size="17" fill="#1f2937">CDN is a backend-bucket feature, not a separate proxy VM</text><text x="640" y="720" text-anchor="middle" font-size="17" fill="#1f2937">Public origin can also be read directly · no VPC / subnet / VM · DNS and certificate are control-plane prerequisites</text></g></svg>