<title id="title">Lab 11 — GKE Quote Engine solution architecture</title>
<desc id="desc">ลูกค้าส่ง HTTPS bearer-authenticated quote request ผ่าน regional external GKE Gateway ไปยัง quote-api ใน GKE Autopilot. API เรียก quote-worker ผ่าน ClusterIP ภายใน; NetworkPolicy จำกัด ingress ให้เฉพาะ gateway/proxy และ API. API และ worker ใช้ Workload Identity Federation for GKE แยก Kubernetes ServiceAccount เพื่ออ่านคนละ secret จาก Secret Manager. Worker ถูก scale ด้วย HPA ตาม CPU. Cloud Build สร้าง image และ Artifact Registry เก็บ image digest; GKE ส่ง logs และ metrics ไป Cloud Logging และ Cloud Monitoring. Cluster ใช้ private nodes ใน VPC-native VPC ที่ asia-southeast1.</desc>
