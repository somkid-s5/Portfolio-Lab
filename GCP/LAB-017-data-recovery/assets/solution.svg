<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="solution-title solution-desc">
<title id="solution-title">Records data protection and recovery architecture</title>
<desc id="solution-desc">An IAM-authenticated Cloud Run Records service writes PostgreSQL records to private-IP Cloud SQL and attachments to a regional Cloud Storage bucket with seven-day soft delete. Cloud SQL point-in-time recovery creates a separate candidate instance. A tagged Cloud Run revision tests that instance before traffic promotion.</desc>
<defs>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/></marker>
  <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0F766E"/></marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#15803D"/></marker>
</defs>
