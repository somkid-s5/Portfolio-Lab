<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc"><title id="title">Partner Webhook Relay delivery and recovery flow</title><desc id="desc">The event API validates and durably records an event and delivery before acknowledging 202. A deterministic task is reconciled and delivered at least once. The worker signs each outbound request, the simulator deduplicates durable receipts, and terminal or unknown outcomes follow distinct paths. Operators inspect before generation-based redrive.</desc><style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.subtitle{font-size:16px;fill:#526174}.frame{font-size:19px;font-weight:700}.zone{font-size:17px;font-weight:700;fill:#185abc}.node{font-size:15px;font-weight:700}.small{font-size:12px;fill:#526174}.tiny{font-size:10px;fill:#64748b}.label{font-size:12px;font-weight:700;fill:#334155}.blue{fill:none;stroke:#2563eb;stroke-width:2.6;marker-end:url(#arr)}.teal{fill:none;stroke:#0f766e;stroke-width:2.4;marker-end:url(#arr2)}.purple{fill:none;stroke:#7c3aed;stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#arrp)}.muted{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:5 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs><rect width="1600" height="1180" fill="#fff"/><text x="28" y="45" class="title">Partner Webhook Relay — delivery, retry and recovery</text><text x="28" y="72" class="subtitle">Delivery status is the durable ledger; Cloud Tasks headers are diagnostics, not the business state machine.</text><rect x="28" y="100" width="1544" height="210" rx="12" fill="#eff6ff" stroke="#2563eb"/><text x="50" y="132" class="frame">1 • Accept durably, acknowledge promptly, enqueue independently</text><rect x="60" y="160" width="260" height="85" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="190" y="191" class="node" text-anchor="middle">Event API</text><text x="190" y="220" class="small" text-anchor="middle">schema • size • idempotency</text><rect x="420" y="160" width="320" height="85" rx="10" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="580" y="191" class="node" text-anchor="middle">Firestore transaction</text><text x="580" y="220" class="small" text-anchor="middle">event + key hash + delivery/outbox</text><rect x="850" y="160" width="230" height="85" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/><text x="965" y="191" class="node" text-anchor="middle">HTTP 202</text><text x="965" y="220" class="small" text-anchor="middle">durable intent only</text><rect x="1220" y="160" width="300" height="85" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="1370" y="191" class="node" text-anchor="middle">Cloud Tasks</text><text x="1370" y="220" class="small" text-anchor="middle">per-partner queue • IDs only</text><path class="blue" d="M320 202H420"/><path class="blue" d="M740 202H850"/><path class="teal" d="M190 245V267H1370V245"/><text x="780" y="292" class="tiny" text-anchor="middle">Event API fast-path CreateTask runs after durable write; Scheduler/Reconciler repairs enqueue_pending if enqueue fails.</text><rect x="28" y="320" width="1544" height="300" rx="12" fill="#f8fafc" stroke="#64748b"/><text x="50" y="352" class="frame">2 • Delivery state machine (one delivery per event + partner)</text><rect x="60" y="390" width="220" height="76" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="170" y="420" class="node" text-anchor="middle">enqueue_pending</text><text x="170" y="445" class="small" text-anchor="middle">durable intent exists</text><rect x="360" y="390" width="190" height="76" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="455" y="420" class="node" text-anchor="middle">queued</text><text x="455" y="445" class="small" text-anchor="middle">task present / retrying</text><rect x="630" y="390" width="210" height="76" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="2"/><text x="735" y="420" class="node" text-anchor="middle">attempt_running</text><text x="735" y="445" class="small" text-anchor="middle">lease + fencing token</text><rect x="950" y="390" width="190" height="76" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/><text x="1045" y="420" class="node" text-anchor="middle">delivered</text><text x="1045" y="445" class="small" text-anchor="middle">2xx + ledger committed</text><path class="blue" d="M280 428H360"/><path class="blue" d="M550 428H630"/><path class="blue" d="M840 428H950"/><path class="blue" d="M735 466V510H455V466"/><text x="590" y="505" class="small" text-anchor="middle">transient: 408 / 429 / 5xx / timeout → task retries</text><rect x="630" y="525" width="230" height="70" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="745" y="552" class="node" text-anchor="middle">permanent_failed</text><text x="745" y="576" class="small" text-anchor="middle">4xx recorded, then ack 2xx</text><path class="teal" d="M735 466V525"/><rect x="950" y="525" width="290" height="70" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/><text x="1095" y="552" class="node" text-anchor="middle">retry_ended_unknown</text><text x="1095" y="576" class="small" text-anchor="middle">GetTask NOT_FOUND + ledger nonterminal</text><path class="purple" d="M455 466V610H1095V595"/><rect x="28" y="650" width="1544" height="214" rx="12" fill="#f5f3ff" stroke="#7c3aed"/><text x="50" y="682" class="frame">3 • Verify the sender, model partner faults, deduplicate receipts</text><rect x="70" y="716" width="370" height="110" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="2"/><text x="255" y="748" class="node" text-anchor="middle">Fresh HMAC per attempt</text><text x="255" y="777" class="small" text-anchor="middle">timestamp + generation + attempt + raw body</text><text x="255" y="802" class="small" text-anchor="middle">constant-time verify • ±300s freshness</text><rect x="610" y="716" width="390" height="110" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="805" y="748" class="node" text-anchor="middle">Simulator fault mode</text><text x="805" y="777" class="small" text-anchor="middle">normal • first 2 × 503 • permanent 400</text><text x="805" y="802" class="small" text-anchor="middle">accept receipt, then return first 503</text><rect x="1170" y="716" width="340" height="110" rx="10" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="1340" y="748" class="node" text-anchor="middle">Partner receipt (create-only)</text><text x="1340" y="777" class="small" text-anchor="middle">event ID + payload hash • ifGenerationMatch=0</text><text x="1340" y="802" class="small" text-anchor="middle">same hash → same 2xx; mismatch → 409</text><path class="blue" d="M440 770H610"/><path class="teal" d="M1000 770H1170"/><text x="800" y="850" class="tiny" text-anchor="middle">In accept-then-503 mode the receipt exists while the sender sees failure; retry uses the same event ID/hash and receives duplicate success.</text><rect x="28" y="895" width="1544" height="238" rx="12" fill="#fff" stroke="#94a3b8"/><text x="50" y="927" class="frame">4 • Reconcile, inspect, then manually redrive</text><rect x="60" y="960" width="320" height="128" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="220" y="992" class="node" text-anchor="middle">Cloud Scheduler → Reconciler</text><text x="220" y="1022" class="small" text-anchor="middle">page ≤25 • pending outbox • GetTask</text><text x="220" y="1051" class="small" text-anchor="middle">missing task + nonterminal → unknown</text><rect x="450" y="960" width="360" height="128" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="630" y="992" class="node" text-anchor="middle">Operator Cloud Shell</text><text x="630" y="1022" class="small" text-anchor="middle">inspect attempts/logs + partner receipt</text><text x="630" y="1051" class="small" text-anchor="middle">active account + mandatory reason</text><rect x="880" y="960" width="360" height="128" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="2"/><text x="1060" y="992" class="node" text-anchor="middle">Redrive transaction</text><text x="1060" y="1022" class="small" text-anchor="middle">audit actor/reason • generation + 1</text><text x="1060" y="1051" class="small" text-anchor="middle">same event ID + payload</text><rect x="1310" y="960" width="240" height="128" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/><text x="1430" y="992" class="node" text-anchor="middle">enqueue_pending</text><text x="1430" y="1022" class="small" text-anchor="middle">Reconciler creates</text><text x="1430" y="1051" class="small" text-anchor="middle">generation-specific task</text><path class="blue" d="M380 1024H450"/><path class="teal" d="M810 1024H880"/><path class="purple" d="M1240 1024H1310"/><text x="800" y="1114" class="tiny" text-anchor="middle">New generation returns to the same state machine above; no automatic redrive and no exactly-once claim.</text></svg>