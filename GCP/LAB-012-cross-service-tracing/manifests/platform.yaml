apiVersion: v1
kind: Namespace
metadata:
  name: checkout
  labels:
    lab: lab012
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: storefront
  namespace: checkout
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: order
  namespace: checkout
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: catalog
  namespace: checkout
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment
  namespace: checkout
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: checkout
automountServiceAccountToken: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: checkout
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      googleclientauth:
        project: "__PROJECT_ID__"
        quota_project: "__PROJECT_ID__"
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
    processors:
      resource/gcp_project_id:
        attributes:
          - action: insert
            value: "__PROJECT_ID__"
            key: gcp.project_id
      batch:
        timeout: 5s
        send_batch_size: 128
    exporters:
      otlphttp/google:
        endpoint: https://telemetry.googleapis.com
        auth:
          authenticator: googleclientauth
    service:
      extensions: [health_check, googleclientauth]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [resource/gcp_project_id, batch]
          exporters: [otlphttp/google]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: checkout
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: checkout
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/part-of: checkout
    spec:
      serviceAccountName: otel-collector
      containers:
        - name: collector
          image: us-docker.pkg.dev/cloud-ops-agents-artifacts/google-cloud-opentelemetry-collector/otelcol-google:0.163.1
          args: ["--config=/etc/otelcol/config.yaml"]
          env:
            - name: GOOGLE_CLOUD_PROJECT
              value: "__PROJECT_ID__"
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: health
              containerPort: 13133
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 20
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: collector-config
              mountPath: /etc/otelcol
              readOnly: true
      volumes:
        - name: collector-config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: checkout
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: checkout
  labels:
    app.kubernetes.io/name: storefront
    app.kubernetes.io/part-of: checkout
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: storefront
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storefront
        app.kubernetes.io/part-of: checkout
    spec:
      serviceAccountName: storefront
      containers:
        - name: app
          image: "__IMAGE_URI__"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVICE_ROLE
              value: storefront
            - name: GOOGLE_CLOUD_PROJECT
              value: "__PROJECT_ID__"
            - name: ORDER_URL
              value: http://order.checkout.svc.cluster.local:80/internal/checkout
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.checkout.svc.cluster.local:4317
            - name: DEMO_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: checkout-demo
                  key: token
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 12
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
