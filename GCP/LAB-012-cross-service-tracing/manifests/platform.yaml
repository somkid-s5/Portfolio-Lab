apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: storefront-ingress
  namespace: checkout
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: storefront
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: 10.36.0.0/23
        - ipBlock:
            cidr: 35.191.0.0/16
        - ipBlock:
            cidr: 130.211.0.0/22
      ports:
        - protocol: TCP
          port: 8080

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: order-ingress
  namespace: checkout
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: order
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: storefront
      ports:
        - protocol: TCP
          port: 8080

---
