<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="940" viewBox="0 0 1280 940" role="img" aria-labelledby="title desc"><title id="title">Daily Sales Close topology</title><desc id="desc">Dedicated GCP project with regional Cloud Scheduler, Cloud Run coordinator and Job, Cloud Storage source/output, Firestore ledger, and global Pub/Sub report-ready topic.</desc><style>text{font-family:Arial,sans-serif;fill:#1f2937}.title{font-size:27px;font-weight:700}.sub{font-size:15px;fill:#526174}.frame{font-size:18px;font-weight:700}.panel{font-size:16px;font-weight:700}.node{font-size:15px;font-weight:700}.resource{font-size:12px;font-family:monospace;fill:#334155}.small{font-size:13px;fill:#526174}.blue{fill:none;stroke:#2563eb;stroke-width:2.2;marker-end:url(#b)}.teal{fill:none;stroke:#0f766e;stroke-width:2.2;marker-end:url(#t)}.purple{fill:none;stroke:#7c3aed;stroke-width:2;stroke-dasharray:6 4;marker-start:url(#p);marker-end:url(#p)}</style><defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="24" y="38" class="title" text-anchor="start">Daily Sales Close — architecture</text><text x="24" y="65" class="sub" text-anchor="start">01:15 report • 02:00 / 14:00 watchdog • Asia/Bangkok</text><rect x="130" y="90" width="1020" height="830" rx="5" fill="#fff" stroke="#1f2937" stroke-width="1.8"/><text x="155" y="119" class="frame" text-anchor="start">Google Cloud • dedicated lab project</text><rect x="155" y="145" width="795" height="700" rx="5" fill="#fbfdff" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="7 5"/><text x="175" y="173" class="frame" text-anchor="start">asia-southeast1 • regional resources</text><rect x="180" y="195" width="745" height="225" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/><text x="198" y="220" class="panel" text-anchor="start">Schedule and execution control</text><rect x="180" y="445" width="745" height="330" rx="5" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.3"/><text x="198" y="470" class="panel" text-anchor="start">Input, run ledger and report data</text><rect x="970" y="145" width="155" height="700" rx="5" fill="#f8fafc" stroke="#64748b" stroke-width="1.3"/><text x="1047" y="173" class="panel" text-anchor="middle">Project-wide</text><text x="1047" y="195" class="panel" text-anchor="middle">services</text><rect x="15" y="330" width="96" height="82" rx="5" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/><text x="63" y="360" class="node" text-anchor="middle">Operator</text><text x="63" y="384" class="small" text-anchor="middle">Cloud Shell</text><rect x="1170" y="240" width="96" height="82" rx="5" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/><text x="1218" y="270" class="node" text-anchor="middle">Consumer</text><text x="1218" y="294" class="small" text-anchor="middle">report-ready</text><image x="225" y="250" width="60" height="60" preserveAspectRatio="xMidYMid meet" xlink:href="data:image/svg+xml;base64,"/><text x="255" y="327" class="node" text-anchor="middle">Cloud Scheduler</text><text x="255" y="348" class="resource" text-anchor="middle">lab008-daily</text><text x="255" y="367" class="small" text-anchor="middle">01:15 • Asia/Bangkok</text><image x="460" y="250" width="60" height="60" preserveAspectRatio="xMidYMid meet" xlink:href="data:image/svg+xml;base64,"/><text x="490" y="327" class="node" text-anchor="middle">Coordinator</text><text x="490" y="348" class="resource" text-anchor="middle">lab008-coordinator</text><text x="490" y="367" class="small" text-anchor="middle">OIDC • IAM target</text><image x="690" y="250" width="60" height="60" preserveAspectRatio="xMidYMid meet" xlink:href="data:image/svg+xml;base64,"/><text x="720" y="327" class="node" text-anchor="middle">Report Job</text><text x="720" y="348" class="resource" text-anchor="middle">lab008-daily-report</text><text x="720" y="367" class="small" text-anchor="middle">one date / execution</text><image x="255" y="555" width="60" height="60" preserveAspectRatio="xMidYMid meet" xlink:href="data:image/svg+xml;base64,"/><text x="285" y="632" class="node" text-anchor="middle">Cloud Storage</text><text x="285" y="653" class="resource" text-anchor="middle">lab008-source</text><text x="285" y="672" class="small" text-anchor="middle">create-only CSV</text><image x="520" y="555" width="60" height="60" preserveAspectRatio="xMidYMid meet" xlink:href="data:image/svg+xml;base64,"/><text x="550" y="632" class="node" text-anchor="middle">Firestore</text><text x="550" y="653" class="resource" text-anchor="middle">lab008-reports</text><text x="550" y="672" class="small" text-anchor="middle">claim / lease / status</text><image x="820" y="555" width="60" height="60" preserveAspectRatio="xMidYMid meet" xlink:href="data:image/svg+xml;base64,"/><text x="850" y="632" class="node" text-anchor="middle">Cloud Storage</text><text x="850" y="653" class="resource" text-anchor="middle">lab008-output</text><text x="850" y="672" class="small" text-anchor="middle">create-only JSON</text><image x="1017" y="250" width="60" height="60" preserveAspectRatio="xMidYMid meet" xlink:href="data:image/svg+xml;base64,"/><text x="1047" y="327" class="node" text-anchor="middle">Pub/Sub</text><text x="1047" y="348" class="resource" text-anchor="middle">lab008-report-ready</text><text x="1047" y="367" class="small" text-anchor="middle">global • regional policy</text>
