<text x="1218" y="644" class="small" text-anchor="middle">email channel</text><path class="blue" d="M285 280H460"/><path class="blue" d="M520 280H690"/><text x="365" y="269" class="small" text-anchor="middle">OIDC + schedule time</text><text x="605" y="269" class="small" text-anchor="middle">Jobs:run + date</text><path class="blue" d="M750 280H1017"/><text x="883" y="269" class="small" text-anchor="middle">report-ready</text><path class="blue" d="M1077 280H1170"/><text x="1123" y="269" class="small" text-anchor="middle">at-least-once</text><path class="blue" d="M1047 555V600"/><path class="blue" d="M1077 630H1170"/><text x="1123" y="618" class="small" text-anchor="middle">alert</text><path class="teal" d="M111 371H140V587H255"/><text x="148" y="520" class="small" text-anchor="start">CSV upload</text><path class="teal" d="M285 555V505H660V310H690"/><text x="470" y="495" class="small" text-anchor="middle">read pinned generation</text><path class="purple" d="M750 310H820V545H580V590"/><text x="700" y="535" class="small" text-anchor="middle">Firestore lease / fence</text><path class="teal" d="M750 300H910V585H880"/><text x="840" y="535" class="small" text-anchor="middle">verified output</text><text x="155" y="875" class="small" text-anchor="start">Manual backfill invokes the same Job with an explicit business date; it reuses the ledger and create-only output path.</text><text x="155" y="900" class="small" text-anchor="start">No VPC/Cloud SQL. Cloud Run structured logs flow through Logging; Monitoring alerts on watchdog findings.</text></svg>