<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="930" viewBox="0 0 1280 930" role="img" aria-labelledby="title desc"><title id="title">Daily Sales Close execution and recovery</title><desc id="desc">Schedule timestamp becomes a logical date. A bounded Job claims ledger state, reads pinned input, creates immutable report and publishes a stable notification event. Failure branches cover overlap, task retry, uncertain publish and backfill.</desc><style>text{font-family:Arial,sans-serif;fill:#1f2937}.title{font-size:27px;font-weight:700}.sub{font-size:15px;fill:#526174}.frame{font-size:18px;font-weight:700}.panel{font-size:16px;font-weight:700}.node{font-size:15px;font-weight:700}.resource{font-size:12px;font-family:monospace;fill:#334155}.small{font-size:13px;fill:#526174}.blue{fill:none;stroke:#2563eb;stroke-width:2.2;marker-end:url(#b)}.teal{fill:none;stroke:#0f766e;stroke-width:2.2;marker-end:url(#t)}.purple{fill:none;stroke:#7c3aed;stroke-width:2;stroke-dasharray:6 4;marker-start:url(#p);marker-end:url(#p)}</style><defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="30" y="40" class="title" text-anchor="start">Daily Sales Close — execution, retry and recovery</text><text x="30" y="68" class="sub" text-anchor="start">Schedule retries, task retries and operator backfill are separate controls</text><rect x="30" y="95" width="1220" height="225" rx="5" fill="#f8fafc" stroke="#64748b"/><text x="50" y="125" class="panel" text-anchor="start">1 • Schedule time becomes the logical report date</text><rect x="55" y="155" width="300" height="125" rx="5" fill="#fff" stroke="#2563eb"/><text x="71" y="184" class="node" text-anchor="start">Cloud Scheduler</text><text x="71" y="214" class="small" text-anchor="start">OIDC request • scheduled timestamp</text><text x="71" y="240" class="small" text-anchor="start">report 01:15 • watchdog 02:00 / 14:00</text><rect x="455" y="155" width="300" height="125" rx="5" fill="#fff" stroke="#2563eb"/><text x="471" y="184" class="node" text-anchor="start">Coordinator</text><text x="471" y="214" class="small" text-anchor="start">validate call and timestamp</text><text x="471" y="240" class="small" text-anchor="start">derive prior business date</text><rect x="855" y="155" width="300" height="125" rx="5" fill="#fff" stroke="#2563eb"/><text x="871" y="184" class="node" text-anchor="start">Cloud Run Job</text><text x="871" y="214" class="small" text-anchor="start">run with date argument</text><text x="871" y="240" class="small" text-anchor="start">task=1 • retry=1</text><path class="blue" d="M355 215H455"/><path class="blue" d="M755 215H855"/><rect x="30" y="345" width="1220" height="255" rx="5" fill="#f5f3ff" stroke="#7c3aed"/><text x="50" y="375" class="panel" text-anchor="start">2 • One date, one bounded batch state</text><rect x="45" y="415" width="180" height="145" rx="5" fill="#fff" stroke="#7c3aed"/><text x="57" y="448" class="node" text-anchor="start">Claim</text><text x="57" y="483" class="small" text-anchor="start">Firestore transaction</text><text x="57" y="509" class="small" text-anchor="start">execution + lease/fence</text><rect x="245" y="415" width="180" height="145" rx="5" fill="#fff" stroke="#7c3aed"/><text x="257" y="448" class="node" text-anchor="start">Read input</text><text x="257" y="483" class="small" text-anchor="start">pin generation</text><text x="257" y="509" class="small" text-anchor="start">≤5 MiB / 5,000 rows</text><rect x="445" y="415" width="180" height="145" rx="5" fill="#fff" stroke="#0f766e"/><text x="457" y="448" class="node" text-anchor="start">Validate</text><text x="457" y="483" class="small" text-anchor="start">strict CSV schema</text><text x="457" y="509" class="small" text-anchor="start">integer cents / stable hash</text><rect x="645" y="415" width="180" height="145" rx="5" fill="#fff" stroke="#0f766e"/><text x="657" y="448" class="node" text-anchor="start">Create report</text><text x="657" y="483" class="small" text-anchor="start">ifGenerationMatch=0</text><text x="657" y="509" class="small" text-anchor="start">verify existing; never overwrite</text><rect x="845" y="415" width="180" height="145" rx="5" fill="#fff" stroke="#2563eb"/><text x="857" y="448" class="node" text-anchor="start">Persist pending</text><text x="857" y="483" class="small" text-anchor="start">notification_pending</text><text x="857" y="509" class="small" text-anchor="start">stable report_id</text><rect x="1045" y="415" width="180" height="145" rx="5" fill="#fff" stroke="#2563eb"/><text x="1057" y="448" class="node" text-anchor="start">Publish / finish</text><text x="1057" y="483" class="small" text-anchor="start">Pub/Sub report-ready</text><text x="1057" y="509" class="small" text-anchor="start">then mark succeeded</text><path class="blue" d="M225 488H245"/><path class="blue" d="M425 488H445"/><path class="blue" d="M625 488H645"/><path class="blue" d="M825 488H845"/><path class="blue" d="M1025 488H1045"/><rect x="30" y="625" width="1220" height="245" rx="5" fill="#fff" stroke="#94a3b8"/><text x="50" y="655" class="panel" text-anchor="start">3 • Failure handling and recovery evidence</text><rect x="55" y="690" width="270" height="135" rx="5" fill="#f0fdf4" stroke="#15803d"/><text x="69" y="720" class="node" text-anchor="start">Overlap</text><text x="69" y="753" class="small" text-anchor="start">Live lease belongs to another</text><text x="69" y="779" class="small" text-anchor="start">execution → no side effect.</text><rect x="355" y="690" width="270" height="135" rx="5" fill="#fef2f2" stroke="#b91c1c"/><text x="369" y="720" class="node" text-anchor="start">After output write</text><text x="369" y="753" class="small" text-anchor="start">Attempt 0 exits once; attempt 1</text><text x="369" y="779" class="small" text-anchor="start">verifies and reuses same report.</text><rect x="655" y="690" width="270" height="135" rx="5" fill="#f0fdf4" stroke="#15803d"/><text x="669" y="720" class="node" text-anchor="start">Publish unknown</text><text x="669" y="753" class="small" text-anchor="start">Keep pending; retry same ID.</text><text x="669" y="779" class="small" text-anchor="start">Consumer deduplicates events.</text><rect x="955" y="690" width="270" height="135" rx="5" fill="#f0fdf4" stroke="#15803d"/><text x="969" y="720" class="node" text-anchor="start">Missed / late</text><text x="969" y="753" class="small" text-anchor="start">Watchdog checks ledger + output</text><text x="969" y="779" class="small" text-anchor="start">log alert; backfill after input.</text><text x="30" y="900" class="small" text-anchor="start">Watchdog log-match alert is operational evidence; no live GCP execution is claimed.</text></svg>