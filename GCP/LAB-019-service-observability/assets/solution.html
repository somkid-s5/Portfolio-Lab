<title id="lab19-title">Lab 19 — Service SLO and incident response</title>
<desc id="lab19-desc">An authenticated Cloud Run task API publishes to Pub/Sub, which invokes an authenticated idempotent worker. A one-off Cloud Run migration job initializes PostgreSQL roles and schema through the same private Direct VPC and Private Services Access path. Cloud Logging, Monitoring, Trace, SLOs, an OIDC uptime check, burn-rate alerts, and the on-call incident flow are shown with project, region, and VPC scopes.</desc>
