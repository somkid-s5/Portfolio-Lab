<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1000" viewBox="0 0 1700 1000" role="img" aria-labelledby="migration-title migration-desc">
<title id="migration-title">Controlled migration and cutover sequence</title><desc id="migration-desc">The baseline path freezes writes, exports the source database, restores into Cloud SQL, reconciles business invariants and then changes the URL map. The gated Database Migration Service option performs initial load and change data capture before freezing, waiting for lag near zero, promoting, reconciling and switching. Backout is permitted only before target writes; afterward use forward recovery or a proven reverse-sync plan.</desc><defs><marker id="a2563EB" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2563EB"/></marker><marker id="a7C3AED" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7C3AED"/></marker><marker id="a475569" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker><style>text{font-family:Arial,"Noto Sans Thai",sans-serif}</style></defs>
<rect width="1700" height="1000" fill="#F7FAFF"/><text x="70" y="70" font-size="27" fill="#1F2937" font-weight="700" text-anchor="start">Migration runbook · baseline and gated Change Request</text>
<rect id="baseline-lane" x="50" y="105" width="1600" height="335" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="78" y="143" font-size="21" fill="#2563EB" font-weight="700" text-anchor="start">Baseline · controlled write-freeze + final export/restore</text>
<rect id="source-step" x="85" y="190" width="220" height="190" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><image id="icon-compute_engine" x="104" y="211" width="62" height="62" href="data:image/svg+xml;base64," role="img" aria-label="compute engine"/><text x="180" y="238" font-size="18" fill="#2563EB" font-weight="700" text-anchor="start">Source</text><text x="104" y="298" font-size="16" fill="#1F2937" font-weight="400" text-anchor="start">Compute Engine VM</text><text x="104" y="328" font-size="16" fill="#1F2937" font-weight="400" text-anchor="start">PostgreSQL 16</text><text x="104" y="357" font-size="14" fill="#475569" font-weight="400" text-anchor="start">API + writers drained</text>
<rect id="freeze-step" x="375" y="190" width="245" height="190" rx="8" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/><text x="497" y="235" font-size="19" fill="#C2410C" font-weight="700" text-anchor="middle">1 · Freeze writes</text><text x="400" y="282" font-size="15" fill="#1F2937" font-weight="400" text-anchor="start">API rejects new writes</text><text x="400" y="311" font-size="15" fill="#1F2937" font-weight="400" text-anchor="start">check active transactions</text><text x="400" y="344" font-size="14" fill="#475569" font-weight="400" text-anchor="start">record freeze timestamp</text>
<rect id="transfer-step" x="687" y="190" width="245" height="190" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/><text x="810" y="235" font-size="19" fill="#7C3AED" font-weight="700" text-anchor="middle">2 · Final transfer</text><text x="712" y="282" font-size="15" fill="#1F2937" font-weight="400" text-anchor="start">pg_dump (custom format)</text><text x="712" y="311" font-size="15" fill="#1F2937" font-weight="400" text-anchor="start">pg_restore to empty target</text><text x="712" y="344" font-size="14" fill="#475569" font-weight="400" text-anchor="start">record duration + manifest</text>
<rect id="reconcile-step" x="999" y="190" width="245" height="190" rx="8" fill="#F0FDF4" stroke="#15803D" stroke-width="2"/><text x="1122" y="235" font-size="19" fill="#15803D" font-weight="700" text-anchor="middle">3 · Reconcile</text><text x="1024" y="282" font-size="15" fill="#1F2937" font-weight="400" text-anchor="start">row count + business totals</text><text x="1024" y="311" font-size="15" fill="#1F2937" font-weight="400" text-anchor="start">status, max ID, sequence</text><text x="1024" y="344" font-size="14" fill="#475569" font-weight="400" text-anchor="start">resolve every mismatch</text>
<rect id="cutover-step" x="1311" y="190" width="290" height="190" rx="8" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/><text x="1456" y="235" font-size="19" fill="#C2410C" font-weight="700" text-anchor="middle">4 · Cut over</text><text x="1336" y="282" font-size="15" fill="#1F2937" font-weight="400" text-anchor="start">URL map → target backend</text><text x="1336" y="311" font-size="15" fill="#1F2937" font-weight="400" text-anchor="start">smoke test; enable target writes</text><text x="1336" y="344" font-size="14" fill="#475569" font-weight="400" text-anchor="start">record boundary + duration</text>
<path id="source-freeze" d="M305 285H375" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a2563EB)"/><path id="freeze-transfer" d="M620 285H687" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a2563EB)"/><path id="transfer-reconcile" d="M932 285H999" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a2563EB)"/><path id="reconcile-cutover" d="M1244 285H1311" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a2563EB)"/>
<rect id="dms-change-request" x="50" y="475" width="1600" height="315" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/><text x="78" y="513" font-size="20" fill="#7C3AED" font-weight="700" text-anchor="start">Change Request · Database Migration Service · cost and access gate first</text>
<rect id="dms-preflight" x="83" y="560" width="230" height="180" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/><image id="icon-database_migration_service" x="101" y="580" width="62" height="62" href="data:image/svg+xml;base64," role="img" aria-label="database migration service"/><text x="178" y="607" font-size="18" fill="#7C3AED" font-weight="700" text-anchor="start">Preflight</text><text x="101" y="660" font-size="14" fill="#1F2937" font-weight="400" text-anchor="start">version + pglogical</text><text x="101" y="687" font-size="14" fill="#1F2937" font-weight="400" text-anchor="start">network + keys + cost</text>
<rect id="dms-cdc" x="355" y="560" width="235" height="180" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/><text x="472" y="605" font-size="17" fill="#7C3AED" font-weight="700" text-anchor="middle">Initial load + CDC</text><text x="376" y="653" font-size="14" fill="#1F2937" font-weight="400" text-anchor="start">snapshot then changes</text><text x="376" y="680" font-size="14" fill="#1F2937" font-weight="400" text-anchor="start">monitor lag and errors</text>
<rect id="dms-freeze" x="632" y="560" width="250" height="180" rx="8" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/><text x="757" y="605" font-size="18" fill="#C2410C" font-weight="700" text-anchor="middle">Freeze + drain</text><text x="653" y="653" font-size="14" fill="#1F2937" font-weight="400" text-anchor="start">stop all source writers</text><text x="653" y="680" font-size="14" fill="#1F2937" font-weight="400" text-anchor="start">wait lag near zero</text>
<rect id="dms-promote" x="924" y="560" width="220" height="180" rx="8" fill="#F0FDF4" stroke="#15803D" stroke-width="2"/><text x="1034" y="605" font-size="18" fill="#15803D" font-weight="700" text-anchor="middle">Promote</text><text x="945" y="653" font-size="14" fill="#1F2937" font-weight="400" text-anchor="start">verify job state</text><text x="945" y="680" font-size="14" fill="#1F2937" font-weight="400" text-anchor="start">promote once</text>
<rect id="dms-check" x="1186" y="560" width="210" height="180" rx="8" fill="#F0FDF4" stroke="#15803D" stroke-width="2"/><text x="1291" y="605" font-size="18" fill="#15803D" font-weight="700" text-anchor="middle">Reconcile</text><text x="1207" y="653" font-size="14" fill="#1F2937" font-weight="400" text-anchor="start">counts + totals</text><text x="1207" y="680" font-size="14" fill="#1F2937" font-weight="400" text-anchor="start">sequence + IDs</text>
<rect id="dms-switch" x="1438" y="560" width="180" height="180" rx="8" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/><text x="1528" y="605" font-size="18" fill="#C2410C" font-weight="700" text-anchor="middle">Switch</text><text x="1459" y="653" font-size="14" fill="#1F2937" font-weight="400" text-anchor="start">URL map to</text><text x="1459" y="680" font-size="14" fill="#1F2937" font-weight="400" text-anchor="start">target backend</text>
<path id="dms-preflight-cdc" d="M313 650H355" fill="none" stroke="#7C3AED" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a7C3AED)"/><path id="dms-cdc-freeze" d="M590 650H632" fill="none" stroke="#7C3AED" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a7C3AED)"/><path id="dms-freeze-promote" d="M882 650H924" fill="none" stroke="#7C3AED" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a7C3AED)"/><path id="dms-promote-check" d="M1144 650H1186" fill="none" stroke="#7C3AED" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a7C3AED)"/><path id="dms-check-switch" d="M1396 650H1438" fill="none" stroke="#7C3AED" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a7C3AED)"/>
<rect id="rollback-boundary" x="50" y="825" width="1600" height="125" rx="10" fill="#FEF2F2" stroke="#B91C1C" stroke-width="2"/><text x="80" y="864" font-size="20" fill="#B91C1C" font-weight="700" text-anchor="start">Backout boundary</text><text x="300" y="864" font-size="16" fill="#1F2937" font-weight="400" text-anchor="start">ก่อน target รับ writes: หยุด target แล้วคืน URL map ได้ หลังตรวจ source ยังเป็น authoritative</text><text x="300" y="904" font-size="16" fill="#1F2937" font-weight="700" text-anchor="start">หลัง target รับ writes: ห้ามสลับกลับทันที — ใช้ forward recovery หรือ reverse sync ที่พิสูจน์แล้วเท่านั้น</text>
</svg>