<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1140" viewBox="0 0 1800 1140" role="img" aria-labelledby="title desc">
<title id="title">Lab 10 — Catalog cache request and recovery flow</title>
<desc id="desc">Read path checks Redis first, returns HIT on a cache hit, queries PostgreSQL on a miss, and falls back directly to PostgreSQL after a bounded Redis error. Write path requires IAM, commits a versioned catalog update to PostgreSQL first, then invalidates product and old/new category keys. If invalidation fails, the API reports it and the old entry is bounded by its remaining 60-second TTL; no stale value is claimed current.</desc>
<style>
text{font-family:Arial,sans-serif;fill:#1f2937}.title{font-size:30px;font-weight:700}.subtitle{font-size:16px;fill:#526174}.lane{font-size:20px;font-weight:700}.node{font-size:17px;font-weight:700}.body{font-size:14px;fill:#334155}.small{font-size:12px;fill:#526174}.tiny{font-size:11px;fill:#526174}.panel{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.request{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.cache{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}.database{fill:#f0fdfa;stroke:#0f766e;stroke-width:2}.response{fill:#f0fdf4;stroke:#15803d;stroke-width:2}.failure{fill:#fff7ed;stroke:#c2410c;stroke-width:2}.operator{fill:#f1f5f9;stroke:#475569;stroke-width:2}.flow-blue{fill:none;stroke:#2563eb;stroke-width:2.5;marker-end:url(#ab)}.flow-teal{fill:none;stroke:#0f766e;stroke-width:2.5;marker-end:url(#at)}.flow-purple{fill:none;stroke:#7c3aed;stroke-width:2.5;marker-end:url(#ap)}.flow-orange{fill:none;stroke:#c2410c;stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#ao)}.flow-gray{fill:none;stroke:#64748b;stroke-width:1.8;stroke-dasharray:5 5;marker-end:url(#ag)}
</style>
<defs>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
<marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker>
<marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c2410c"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
</defs>
<rect width="1800" height="1140" fill="#fff"/>
<text x="38" y="48" class="title">Catalog cache — hit, miss, update and failure behavior</text>
<text x="38" y="77" class="subtitle">Cache-aside · PostgreSQL is authoritative · no stale response is presented as current</text>

<rect x="32" y="112" width="1736" height="510" rx="8" fill="#f8fbff" stroke="#2563eb" stroke-width="1.5"/>
<text x="54" y="146" class="lane">Read path</text>

<rect x="60" y="225" width="225" height="118" rx="8" class="request"/>
<text x="82" y="263" class="node">GET catalog</text><text x="82" y="290" class="body">id or category</text><text x="82" y="316" class="small">bounded list: 50</text>

<rect x="365" y="225" width="280" height="118" rx="8" class="request"/>
<text x="390" y="263" class="node">catalog-public</text><text x="390" y="290" class="body">validate + normalize key</text><text x="390" y="316" class="small">request id / status log</text>
<path d="M285 284H365" class="flow-blue"/>

<polygon points="785,225 900,284 785,343 670,284" class="cache"/>
<text x="715" y="279" class="node">Redis GET</text><text x="718" y="302" class="small">≤250 ms · TTL 60s</text>
<path d="M645 284H670" class="flow-purple"/>

<rect x="1030" y="172" width="300" height="112" rx="8" class="response"/>
<text x="1055" y="212" class="node">Cache HIT</text><text x="1055" y="240" class="body">return 200 · X-Cache: HIT</text>
<path d="M900 268H1030" class="flow-teal"/><text x="938" y="250" class="small">HIT</text>

<rect x="1030" y="340" width="350" height="132" rx="8" class="database"/>
<text x="1055" y="378" class="node">Cloud SQL · PostgreSQL</text>
<text x="1055" y="405" class="body">MISS or Redis error → SELECT</text>
<text x="1055" y="432" class="small">IAM DB auth · private IP</text>
<path d="M785 343V406H1030" class="flow-teal"/>
<text x="812" y="389" class="small">MISS / ERROR</text>

<rect x="1440" y="340" width="285" height="132" rx="8" class="response"/>
<text x="1462" y="378" class="node">Return catalog</text>
<text x="1462" y="405" class="body">MISS → SETEX TTL 60s → 200</text>
<text x="1462" y="432" class="small">ERROR → BYPASS from DB</text>
<path d="M1380 406H1440" class="flow-teal"/>

<path d="M1205 472V510" class="flow-orange"/>

<rect x="58" y="510" width="1668" height="80" rx="7" class="failure"/>
<text x="82" y="542" class="node">DB error or pool exhausted → sanitized 503</text>
<text x="82" y="567" class="body">Circuit breaker is per Cloud Run instance; error detail/token/product payload is never returned or logged.</text>

<rect x="32" y="654" width="1736" height="440" rx="8" fill="#fbfaff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="54" y="688" class="lane">IAM-protected change / invalidation path</text>

<rect x="58" y="748" width="250" height="125" rx="8" class="operator"/>
<text x="82" y="786" class="node">Operator</text><text x="82" y="813" class="body">IAM invoker</text><text x="82" y="840" class="small">PUT + If-Match version</text>

<rect x="380" y="748" width="275" height="125" rx="8" class="request"/>
<text x="405" y="786" class="node">catalog-admin</text><text x="405" y="813" class="body">validate + authorize</text><text x="405" y="840" class="small">separate writer identity</text>
<path d="M308 810H380" class="flow-purple"/>

<rect x="730" y="748" width="300" height="125" rx="8" class="database"/>
<text x="755" y="786" class="node">Commit to PostgreSQL</text><text x="755" y="813" class="body">version = version + 1</text><text x="755" y="840" class="small">DB remains source of truth</text>
<path d="M655 810H730" class="flow-teal"/>

<rect x="1110" y="748" width="280" height="125" rx="8" class="cache"/>
<text x="1132" y="786" class="node">Invalidate Redis keys</text><text x="1132" y="813" class="body">product + old/new category</text><text x="1132" y="840" class="small">bounded set · no FLUSHDB</text>
<path d="M1030 810H1110" class="flow-purple"/>

<rect x="1465" y="748" width="258" height="125" rx="8" class="response"/>
<text x="1487" y="786" class="node">Fresh read</text><text x="1487" y="813" class="body">new version · cache MISS</text><text x="1487" y="840" class="small">next read repopulates</text>
<path d="M1390 810H1465" class="flow-teal"/>

<rect x="735" y="918" width="880" height="112" rx="8" class="failure"/>
<text x="760" y="955" class="node">If Redis invalidation fails</text>
<text x="760" y="981" class="body">DB commit remains valid · report invalidation not confirmed · stale bound ≤ remaining 60s TTL</text>
<text x="760" y="1007" class="small">Once cache connection recovers, read bypasses during circuit-open period then refills from PostgreSQL.</text>
<path d="M1250 873V918" class="flow-orange"/>
</svg>