<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 930" role="img" aria-labelledby="title desc"><title id="title">Private Inventory service architecture</title><desc id="desc">A private client subnet connects through a regional internal passthrough load balancer to two vertically arranged application VMs in two zones sharing an application subnet. Both applications access one PostgreSQL VM in a separate data subnet. A private Cloud DNS zone is associated with the VPC.</desc><defs><marker id="blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#2563eb"/></marker><marker id="purple" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#7c3aed"/></marker></defs><rect width="1280" height="930" fill="white"/><g font-family="Arial, sans-serif" fill="#1f2937"><text x="36" y="34" font-size="16" fill="#526174">GCP SOLUTION LAB / 02 · PLANNED ARCHITECTURE</text><text x="36" y="76" font-size="32" font-weight="700">Private Inventory. Shared data. Explicit access.</text><rect x="30" y="110" width="1220" height="760" rx="3" fill="white" stroke="#334155" /><text x="48" y="142" font-size="22">Google Cloud / Lab project</text><svg x="148" y="190" width="64" height="64" viewBox="0 0 24 24"><title>Icon_24px_DNS_Color</title><g data-name="Product Icons"><g data-name="colored-32/dns"><g ><polygon fill="#4285f4" points="13 18 11 18 11 8 13 8 13 18"/><polygon fill="#669df6" points="2 21 22 21 22 19 2 19 2 21"/><polygon fill="#aecbfa" points="10 22 14 22 14 18 10 18 10 22"/></g></g><rect fill="#aecbfa" x="2" y="2" width="20" height="6"/><rect fill="#669df6" x="12" y="2" width="10" height="6"/><rect fill="#fff" x="4" y="4" width="2" height="2"/><rect fill="#aecbfa" x="2" y="10" width="20" height="6"/><rect fill="#669df6" x="12" y="10" width="10" height="6"/><rect fill="#fff" x="4" y="12" width="2" height="2"/></g></svg><text x="180" y="282" text-anchor="middle" font-size="18" fill="#1f293