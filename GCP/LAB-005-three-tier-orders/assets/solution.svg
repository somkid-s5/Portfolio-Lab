<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="984" viewBox="0 0 1280 984" role="img" aria-labelledby="title desc">
<title id="title">Lab005 Orders private three-tier topology</title><desc id="desc">Browser HTTPS global load balancer to two vertically stacked Web VMs, internal TCP load balancer and two API VMs; private connector to Cloud SQL regional HA in producer network.</desc>
<style>text{font-family:Arial,sans-serif;fill:#1f2937} .h{font-size:20px;font-weight:700} .n{font-size:18px;font-weight:700} .s{font-size:16px;fill:#526174} .small{font-size:15px;fill:#526174} .arrow{fill:none;stroke:#2563eb;stroke-width:2;marker-end:url(#tip)} .ops{fill:none;stroke:#7c3aed;stroke-width:2;stroke-dasharray:6 4;marker-end:url(#purple)}</style>
