name: Inspect lab checks
on:
  pull_request:
    paths:
      - '.github/workflows/ci-run-diagnostics.yml'
      - 'GCP/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Show failing jobs across full paginated runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for run in 40210048706 40210861334 40211073810; do
            echo "=== RUN $run ==="
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=100" \
              --jq '.jobs[] | select(.conclusion == "failure") | "\(.id) \(.name) \(.html_url)"'
          done
