name: Lab materials verification
on:
  pull_request:
    paths:
      - 'GCP/**'
      - '.github/workflows/lab-materials.yml'
  workflow_dispatch:
concurrency:
  group: lab-materials-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  lab001:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check startup script syntax
        run: bash -n GCP/LAB-001-multi-zone-web/scripts/startup.sh
      - name: Compile Python materials
        run: python3 -m py_compile GCP/LAB-001-multi-zone-web/scripts/probe.py GCP/LAB-001-multi-zone-web/tests/test_materials.py
      - name: Exercise embedded app and bounded probe
        run: python3 -m unittest discover -s GCP/LAB-001-multi-zone-web/tests -v
      - name: Render baseline diagram at reading width
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y librsvg2-bin
          mkdir -p diagram-previews
          rsvg-convert --width 960 GCP/LAB-001-multi-zone-web/assets/solution.svg -o diagram-previews/lab001-solution.png
          rsvg-convert --width 960 GCP/LAB-001-multi-zone-web/assets/solution-after-change.svg -o diagram-previews/lab001-after-change.png
      - uses: actions/upload-artifact@v4
        with:
          name: lab001-diagram-preview
          path: diagram-previews/*.png
          retention-days: 14

  lab002:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: lab002_ci
          POSTGRES_USER: inventory_ci
          POSTGRES_PASSWORD: disposable-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inventory_ci -d lab002_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: lab002_ci
      PGUSER: inventory_ci
      PGPASSWORD: disposable-ci-only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install distro PostgreSQL driver
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-psycopg2 librsvg2-bin
      - name: Check App installer shell syntax
        run: bash -n GCP/LAB-002-private-inventory/scripts/install-app.sh
      - name: Exercise Inventory against PostgreSQL 15
        run: /usr/bin/python3 -m unittest discover -s GCP/LAB-002-private-inventory/tests -v
      - name: Render Inventory solution and operations views
        run: |
          mkdir -p lab002-previews
          rsvg-convert --width 960 GCP/LAB-002-private-inventory/assets/solution.svg -o lab002-previews/solution.png
          rsvg-convert --width 960 GCP/LAB-002-private-inventory/assets/operations.svg -o lab002-previews/operations.png
      - uses: actions/upload-artifact@v4
        with:
          name: lab002-diagram-preview
          path: lab002-previews/*.png
          retention-days: 14

  lab003:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify deterministic releases and safe publish planning
        run: python3 -m unittest discover -s GCP/LAB-003-public-docs-cdn/tests -v
      - name: Render docs delivery and release views
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y librsvg2-bin
          mkdir -p lab003-previews
          rsvg-convert --width 960 GCP/LAB-003-public-docs-cdn/assets/solution.svg -o lab003-previews/solution.png
          rsvg-convert --width 960 GCP/LAB-003-public-docs-cdn/assets/release-flow.svg -o lab003-previews/release-flow.png
          python3 -c "import base64,pathlib; [print('LAB003_PREVIEW_'+p.stem.upper().replace('-','_')+'='+base64.b64encode(p.read_bytes()).decode()) for p in sorted(pathlib.Path('lab003-previews').glob('*.png'))]"
      - uses: actions/upload-artifact@v4
        with:
          name: lab003-diagram-preview
          path: lab003-previews/*.png
          retention-days: 14

  lab004:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: booking_ci
          POSTGRES_USER: booking_admin
          POSTGRES_PASSWORD: disposable-booking-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U booking_admin -d booking_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGDATABASE: booking_ci
      PGUSER: booking_admin
      PGPASSWORD: disposable-booking-ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Booking dependencies
        run: |
          python3 -m venv .ci-lab004
          .ci-lab004/bin/pip install -r GCP/LAB-004-serverless-booking/requirements.txt
      - name: Check browser script syntax
        run: node --check GCP/LAB-004-serverless-booking/app/static/app.js
      - name: Verify Booking against PostgreSQL 16
        run: .ci-lab004/bin/python -m unittest discover -s GCP/LAB-004-serverless-booking/tests -v
      - name: Build self-contained application image
        run: docker build -t lab004-booking:ci GCP/LAB-004-serverless-booking
