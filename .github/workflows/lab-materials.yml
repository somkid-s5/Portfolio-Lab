name: Lab materials verification
on:
  pull_request:
    paths:
      - 'GCP/**'
      - '.github/workflows/lab-materials.yml'
  workflow_dispatch:
concurrency:
  group: lab-materials-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  lab001:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check startup script syntax
        run: bash -n GCP/LAB-001-multi-zone-web/scripts/startup.sh
      - name: Compile Python materials
        run: python3 -m py_compile GCP/LAB-001-multi-zone-web/scripts/probe.py GCP/LAB-001-multi-zone-web/tests/test_materials.py
      - name: Exercise embedded app and bounded probe
        run: python3 -m unittest discover -s GCP/LAB-001-multi-zone-web/tests -v
      - name: Render baseline diagram at reading width
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y librsvg2-bin
          mkdir -p diagram-previews
          rsvg-convert --width 960 GCP/LAB-001-multi-zone-web/assets/solution.svg -o diagram-previews/lab001-solution.png
          rsvg-convert --width 960 GCP/LAB-001-multi-zone-web/assets/solution-after-change.svg -o diagram-previews/lab001-after-change.png
      - uses: actions/upload-artifact@v4
        with:
          name: lab001-diagram-preview
          path: diagram-previews/*.png
          retention-days: 14

  lab002:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: lab002_ci
          POSTGRES_USER: inventory_ci
          POSTGRES_PASSWORD: disposable-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inventory_ci -d lab002_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: lab002_ci
      PGUSER: inventory_ci
      PGPASSWORD: disposable-ci-only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install distro PostgreSQL driver
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-psycopg2 librsvg2-bin
      - name: Check App installer shell syntax
        run: bash -n GCP/LAB-002-private-inventory/scripts/install-app.sh
      - name: Exercise Inventory against PostgreSQL 15
        run: /usr/bin/python3 -m unittest discover -s GCP/LAB-002-private-inventory/tests -v
      - name: Render Inventory solution and operations views
        run: |
          mkdir -p lab002-previews
          rsvg-convert --width 960 GCP/LAB-002-private-inventory/assets/solution.svg -o lab002-previews/solution.png
          rsvg-convert --width 960 GCP/LAB-002-private-inventory/assets/operations.svg -o lab002-previews/operations.png
      - uses: actions/upload-artifact@v4
        with:
          name: lab002-diagram-preview
          path: lab002-previews/*.png
          retention-days: 14

  lab003:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify deterministic releases and safe publish planning
        run: python3 -m unittest discover -s GCP/LAB-003-public-docs-cdn/tests -v
      - name: Render docs delivery and release views
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y librsvg2-bin
          mkdir -p lab003-previews
          rsvg-convert --width 960 GCP/LAB-003-public-docs-cdn/assets/solution.svg -o lab003-previews/solution.png
          rsvg-convert --width 960 GCP/LAB-003-public-docs-cdn/assets/release-flow.svg -o lab003-previews/release-flow.png
          python3 -c "import base64,pathlib; [print('LAB003_PREVIEW_'+p.stem.upper().replace('-','_')+'='+base64.b64encode(p.read_bytes()).decode()) for p in sorted(pathlib.Path('lab003-previews').glob('*.png'))]"
      - uses: actions/upload-artifact@v4
        with:
          name: lab003-diagram-preview
          path: lab003-previews/*.png
          retention-days: 14

  lab004:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: booking_ci
          POSTGRES_USER: booking_admin
          POSTGRES_PASSWORD: disposable-booking-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U booking_admin -d booking_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGDATABASE: booking_ci
      PGUSER: booking_admin
      PGPASSWORD: disposable-booking-ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Booking dependencies
        run: |
          python3 -m venv .ci-lab004
          .ci-lab004/bin/pip install -r GCP/LAB-004-serverless-booking/requirements.txt
      - name: Check browser script syntax
        run: node --check GCP/LAB-004-serverless-booking/app/static/app.js
      - name: Verify Booking against PostgreSQL 16
        run: .ci-lab004/bin/python -m unittest discover -s GCP/LAB-004-serverless-booking/tests -v
      - name: Build self-contained application image
        run: docker build -t lab004-booking:ci GCP/LAB-004-serverless-booking
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Validate foundation without credentials or cloud provisioning
        working-directory: GCP/LAB-004-serverless-booking/infra
        run: |
          terraform fmt -recursive
          terraform init -backend=false -input=false
          terraform validate -no-color
      - name: Generate official-icon architecture and rotation SVG
        run: .ci-lab004/bin/python GCP/LAB-004-serverless-booking/scripts/render-diagrams.py
      - name: Render Booking diagrams at reading width
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y librsvg2-bin
          mkdir -p lab004-previews
          rsvg-convert --width 960 GCP/LAB-004-serverless-booking/assets/solution.svg -o lab004-previews/solution.png
          rsvg-convert --width 960 GCP/LAB-004-serverless-booking/assets/credential-rotation.svg -o lab004-previews/credential-rotation.png
          python3 -c "import base64,pathlib; [print('LAB004_PREVIEW_'+p.stem.upper().replace('-','_')+'='+base64.b64encode(p.read_bytes()).decode()) for p in sorted(pathlib.Path('lab004-previews').glob('*.png'))]"
      - uses: actions/upload-artifact@v4
        with:
          name: lab004-diagram-preview
          path: lab004-previews/*.png
          retention-days: 14

  lab005:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: orders_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-orders-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d orders_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGDATABASE: orders_ci
      PGUSER: postgres
      PGPASSWORD: disposable-orders-ci
      LAB005_UI_PREVIEW: lab005-previews/ui-ci.png
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Nginx config validator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nginx fonts-noto-core
      - name: Install pinned Orders dependencies
        run: |
          python3 -m venv .ci-lab005
          .ci-lab005/bin/pip install -r GCP/LAB-005-three-tier-orders/requirements.txt -r GCP/LAB-005-three-tier-orders/tests/requirements.txt
      - name: Check Orders browser script syntax
        run: node --check GCP/LAB-005-three-tier-orders/web/app.js
      - name: Verify isolated real bootstrap and refusal to reset existing login
        run: .ci-lab005/bin/python GCP/LAB-005-three-tier-orders/tests/bootstrap_check.py
      - name: Verify Orders transactions, API boundaries and Web config
        run: .ci-lab005/bin/python -m unittest discover -s GCP/LAB-005-three-tier-orders/tests -v
      - name: Emit real browser CI preview
        run: python3 -c "import base64,pathlib; print('LAB005_UI_PREVIEW='+base64.b64encode(pathlib.Path('lab005-previews/ui-ci.png').read_bytes()).decode())"
      - uses: actions/upload-artifact@v4
        with:
          name: lab005-web-ui-ci-preview
          path: lab005-previews/ui-ci.png
          if-no-files-found: error
          retention-days: 14

  lab005-infra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Validate all Orders Terraform roots without credentials or provisioning
        run: |
          for root in foundation bootstrap workloads; do
            terraform -chdir="GCP/LAB-005-three-tier-orders/infra/$root" fmt -recursive
            terraform -chdir="GCP/LAB-005-three-tier-orders/infra/$root" init -backend=false -input=false
            terraform -chdir="GCP/LAB-005-three-tier-orders/infra/$root" validate -no-color
          done

  lab005-diagrams:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate official-icon topology and operations SVGs
        run: python3 GCP/LAB-005-three-tier-orders/scripts/render-diagrams.py
      - name: Render diagrams at document width
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y librsvg2-bin
          mkdir -p lab005-diagram-previews
          rsvg-convert --width 960 GCP/LAB-005-three-tier-orders/assets/solution.svg -o lab005-diagram-previews/solution.png
          rsvg-convert --width 960 GCP/LAB-005-three-tier-orders/assets/operations.svg -o lab005-diagram-previews/operations.png
          python3 -c "import base64,pathlib; [print('LAB005_DIAGRAM_'+p.stem.upper()+'='+base64.b64encode(p.read_bytes()).decode()) for p in sorted(pathlib.Path('lab005-diagram-previews').glob('*.png'))]"
      - uses: actions/upload-artifact@v4
        with:
          name: lab005-diagrams
          path: |
            lab005-diagram-previews/*.png
            GCP/LAB-005-three-tier-orders/assets/*.svg
            GCP/LAB-005-three-tier-orders/assets/diagram-provenance.json
          retention-days: 14

  lab005-guide:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parse guide examples and check committed links without executing commands
        run: python3 -m unittest discover -s GCP/LAB-005-three-tier-orders/tests -p test_guide.py -v

  lab006-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Upload portal browser script syntax
        run: node --check GCP/LAB-006-private-file-processing/app/static/app.js
      - name: Verify bounded CSV processing and deterministic business summaries
        run: |
          python3 -m unittest discover -s GCP/LAB-006-private-file-processing/tests -p test_csv_domain.py -v
          python3 -m unittest discover -s GCP/LAB-006-private-file-processing/tests -p test_job_state.py -v
          python3 -m unittest discover -s GCP/LAB-006-private-file-processing/tests -p test_storage_events.py -v

  lab006-firestore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8086
      GOOGLE_CLOUD_PROJECT: demo-lab006
      CLOUDSDK_CORE_PROJECT: demo-lab006
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: cloud-firestore-emulator
      - name: Install Firestore client for emulator integration
        run: |
          python3 -m venv .ci-lab006
          .ci-lab006/bin/pip install -r GCP/LAB-006-private-file-processing/requirements.txt -r GCP/LAB-006-private-file-processing/tests/requirements.txt
      - name: Install Thai browser preview fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-core
      - name: Verify GCS adapter SDK contracts without cloud calls
        run: .ci-lab006/bin/python -m unittest discover -s GCP/LAB-006-private-file-processing/tests -p test_gcs_objects.py -v
      - name: Verify real SDK signed policy conditions and generation binding without signing calls
        run: .ci-lab006/bin/python -m unittest discover -s GCP/LAB-006-private-file-processing/tests -p test_signed_access.py -v
      - name: Verify worker HTTP event acknowledgement and safe errors
        run: .ci-lab006/bin/python -m unittest discover -s GCP/LAB-006-private-file-processing/tests -p test_worker_http.py -v
      - name: Verify portal session CSRF and owner boundaries
        run: .ci-lab006/bin/python -m unittest discover -s GCP/LAB-006-private-file-processing/tests -p test_portal_http.py -v
      - name: Verify private demo credentials and attached-identity runtime contracts
        run: .ci-lab006/bin/python -m unittest discover -s GCP/LAB-006-private-file-processing/tests -p test_portal_runtime.py -v
      - name: Exercise real emulator transactions without cloud credentials
        shell: bash
        run: |
          gcloud emulators firestore start --host-port=127.0.0.1:8086 --database-mode=firestore-native --quiet > "$RUNNER_TEMP/lab006-firestore.log" 2>&1 &
          EMULATOR_PID=$!
          trap 'kill "$EMULATOR_PID" 2>/dev/null || true' EXIT
          .ci-lab006/bin/python - <<'PY'
          import socket, time, subprocess
          for attempt in range(120):
              try:
                  with socket.create_connection(("127.0.0.1", 8086), timeout=0.5):
                      break
              except OSError:
                  time.sleep(0.5)
          else:
              raise SystemExit("Firestore emulator did not become ready")
          subprocess.run([".ci-lab006/bin/python", "-m", "unittest", "discover",
                          "-s", "GCP/LAB-006-private-file-processing/tests",
                          "-p", "test_firestore_jobs.py", "-v"],
                         check=True, timeout=180)
          subprocess.run([".ci-lab006/bin/python", "-m", "unittest", "discover",
                          "-s", "GCP/LAB-006-private-file-processing/tests",
                          "-p", "test_browser_journey.py", "-v"],
                         check=True, timeout=180)
          PY
      - name: Emit real browser CI preview
        run: python3 -c "import base64,pathlib; print('LAB006_UI_PREVIEW='+base64.b64encode(pathlib.Path('lab006-previews/ui-ci.png').read_bytes()).decode())"
      - uses: actions/upload-artifact@v4
        with:
          name: lab006-ui-ci-preview
          path: lab006-previews/ui-ci.png
          if-no-files-found: error
          retention-days: 14
      - name: Show emulator diagnostics on failure
        if: failure()
        run: tail -n 100 "$RUNNER_TEMP/lab006-firestore.log"
