  lab008-firestore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8087
      GOOGLE_CLOUD_PROJECT: demo-lab008
      CLOUDSDK_CORE_PROJECT: demo-lab008
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: cloud-firestore-emulator
      - name: Install pinned Lab 08 dependencies
        run: |
          python3 -m venv .ci-lab008
          .ci-lab008/bin/pip install -r GCP/LAB-008-daily-batch-reports/requirements.txt
      - name: Test generation-pinned Cloud Storage adapter without cloud calls
        run: .ci-lab008/bin/python -m unittest discover -s GCP/LAB-008-daily-batch-reports/tests -p test_storage.py -v
      - name: Exercise Firestore transactions against loopback emulator
        shell: bash
        run: |
          gcloud emulators firestore start --host-port=127.0.0.1:8087 --database-mode=firestore-native --quiet > "$RUNNER_TEMP/lab008-firestore.log" 2>&1 &
          EMULATOR_PID=$!
          trap 'kill "$EMULATOR_PID" 2>/dev/null || true' EXIT
          .ci-lab008/bin/python - <<'PY'
          import socket, time, subprocess
          for attempt in range(120):
              try:
                  with socket.create_connection(("127.0.0.1", 8087), timeout=0.5):
                      break
              except OSError:
                  time.sleep(0.5)
          else:
              raise SystemExit("Firestore emulator did not become ready")
          subprocess.run([".ci-lab008/bin/python", "-m", "unittest", "discover",
                          "-s", "GCP/LAB-008-daily-batch-reports/tests",
                          "-p", "test_firestore_ledger.py", "-v"],
                         check=True, timeout=180)
          PY
      - name: Show Firestore emulator diagnostics on failure
        if: failure()
        run: |
          if [[ -f "$RUNNER_TEMP/lab008-firestore.log" ]]; then
            tail -100 "$RUNNER_TEMP/lab008-firestore.log"
          fi

